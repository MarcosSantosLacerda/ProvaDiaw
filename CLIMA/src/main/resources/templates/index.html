<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" th:href="@{css/style.css}">
    <form method="get" th:action="@{/}">
    </form>
    <input type="number" name="idadeMin" th:value="${idadeMin}"> 
    <input type="number" name="idadeMax" th:value="${idadeMax}"> 
    <label>
        <input type="radio" name="genero" value="" th:checked="${generoSelecionado == ''}">
        Todos
    </label>
    <label th:each="g : ${generos}">
        <input type="radio" name="genero" th:value="${g}" th:checked="${g == generoSelecionado}">
        <span th:text="${g}">Gênero</span>
    </label>
    <select name="escolaridade">
        <option value="" th:selected="${escolaridadeSelecionada == ''}">Todas</option>
        <option th:each="e: ${escolaridades}"
        th:value="${e}"
        th:text="${e}"
        th:selected="${e == escolaridadeSelecionada}"></option>
    </select>
    <article class="card-candidato" th:each="cand : ${candidatos}"></article>
    <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}" th:alt="${cand.nomeUrna}" class="foto-candidato">
    <p th:text="${cand.cargo + ' · ' + cand.siglaPartido}">Cargo · Partido</p>
    <span class="etiqueta"
        th:classappend="${cand.genero== 'FEMININO' ? 'etiqueta-f' : (cand.genero == 'MASCULINO' ? 'etiqueta-m' : '')}"
        th:text="${cand.genero}">Genero</span>
    <span class="etiqueta-idade" th:if="${cand.idade > 0 }"
        th:text="${cand.idade + ' anos }" > 00 anos </span>
    <p th: if="${cand.grauInstrucao != null and can.grauInstrucao != '#NULO' and !cand.grauInstrucao.isBlank()}"
        th:text="${cand.grauInstrucao}" > Escolaridade</p>
    <p th:if="${cand.ocupacao != null and cand.ocupacao != '#NULO' and !cand.ocupacao.isBlank()}"
        th:text="${cand.ocupacao}">Ocupação</p>
    <p class="resultado-info" >
        <strong th:text="${totalEncontrado}">0</strong> candidato(s) encontrado(s).
</p>
<p th:if="${totalEncontrado == 0 }" class="sem-resultado">Nenhum Candidato Encontrado com esse filtro</p>
<button type="submit">Filtrar</button> 
<a th:href="@{/}" class="limpar">Limpar</a>
</html>
